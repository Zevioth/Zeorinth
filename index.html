
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Test File</title>
</head>
<body style="font-family: Arial; text-align: center; padding: 50px;">

  <h2>Download Test File</h2>
  <p>Download your handmade test.txt file.</p>

  <button onclick="downloadFile()" style="
    padding: 12px 24px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  ">
    Download test.txt
  </button>

  <script>
    function downloadFile() {
      const content = "Hello! This is my handmade test.txt file.";
      const blob = new Blob([content], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "test.txt";
      link.click();

      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
